  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #fff;
      --text: #1f2937;
      --muted: #667085;
      --line: #d9dee7;
      --blue: #2563eb;
      --green: #12805c;
      --amber: #b76e00;
      --red: #b42318;
      --teal: #087f8c;
      --purple: #6941c6;
      --soft-blue: #e8f0ff;
      --soft-green: #e7f6ef;
      --soft-amber: #fff3d6;
      --soft-red: #ffe8e5;
      --soft-teal: #e2f5f7;
      --soft-purple: #f0e9ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }

    header {
      background: #202938;
      color: white;
      padding: 22px 28px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 26px;
      letter-spacing: 0;
    }

    header p {
      margin: 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    main {
      max-width: 1360px;
      margin: 0 auto;
      padding: 22px;
    }

    .banner {
      border: 1px solid #ffd166;
      background: var(--soft-amber);
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
    }

    .banner strong {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .banner span {
      color: #624400;
      font-size: 14px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .metric, .panel, .job-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .metric {
      padding: 16px;
      min-height: 96px;
    }

    .metric .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .metric .value {
      font-size: 31px;
      font-weight: 700;
      line-height: 1;
    }

    .metric .note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      margin: 24px 0 12px;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .section-head p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 1px solid var(--line);
      background: white;
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      min-height: 36px;
    }

    button.active {
      border-color: var(--blue);
      background: var(--soft-blue);
      color: #174ea6;
      font-weight: 600;
    }

    .recommend-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .job-card {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 286px;
    }

    .job-card h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .job-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .job-card p {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      background: var(--soft-blue);
      color: #174ea6;
      white-space: nowrap;
    }

    .badge.green { background: var(--soft-green); color: var(--green); }
    .badge.amber { background: var(--soft-amber); color: #7a4b00; }
    .badge.red { background: var(--soft-red); color: var(--red); }
    .badge.teal { background: var(--soft-teal); color: var(--teal); }
    .badge.purple { background: var(--soft-purple); color: var(--purple); }
    .badge.boss { background: #e9f7ef; color: #00a35c; }
    .badge.linkedin { background: #e6f1fb; color: #0a66c2; }
    .badge.jobsdb { background: #e8f6ee; color: #168445; }

    .score {
      display: flex;
      align-items: baseline;
      gap: 6px;
      color: var(--green);
      font-weight: 700;
    }

    .score strong {
      font-size: 24px;
    }

    .actions {
      margin-top: auto;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    a.action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      min-height: 36px;
      padding: 8px 12px;
      background: var(--blue);
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    a.secondary {
      background: white;
      color: var(--blue);
      border: 1px solid var(--line);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 18px;
    }

    .panel {
      padding: 18px;
    }

    .funnel {
      display: grid;
      gap: 10px;
    }

    .funnel-row {
      display: grid;
      grid-template-columns: 94px 1fr 42px;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }

    .bar-track {
      height: 24px;
      background: #edf1f7;
      border-radius: 6px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      min-width: 2px;
      background: var(--blue);
      border-radius: 6px;
    }

    .bar.green { background: var(--green); }
    .bar.amber { background: var(--amber); }
    .bar.teal { background: var(--teal); }

    .todo-list {
      display: grid;
      gap: 10px;
    }

    .todo {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcfe;
    }

    .todo strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .todo p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: white;
    }

    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      background: #f9fafb;
    }

    .muted { color: var(--muted); }

    @media (max-width: 980px) {
      .metrics, .recommend-grid, .layout { grid-template-columns: 1fr; }
      header, main { padding-left: 16px; padding-right: 16px; }
      .banner { align-items: flex-start; flex-direction: column; }
      .funnel-row { grid-template-columns: 76px 1fr 34px; }
    }
  </style>
</head>

    let activeStatus = "全部";
    const appliedGroups = new Set(["已投递", "沟通中", "面试中", "谈薪中", "Offer"]);
    const actionWords = ["笔试", "面试", "interview", "assessment", "test", "complete", "补充", "回复", "安排"];

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch]));
    }

    function hasAction(job) {
      const text = `${job.status} ${job.followup} ${job.risk}`.toLowerCase();
      return actionWords.some(word => text.includes(word.toLowerCase()));
    }

    function platformBadge(source) {
      const klass = source === "BOSS" ? "boss" : source === "LinkedIn" ? "linkedin" : source === "JobsDB" ? "jobsdb" : "";
      return `<span class="badge ${klass}">${escapeHtml(source)}</span>`;
    }

    function badge(text) {
      const value = text || "未填";
      const klass = value === "高" || value === "Offer" ? "green" : value === "中" || value === "新发现" ? "amber" : value === "已投" || value === "已投递" ? "teal" : value === "拒" ? "red" : "";
      return `<span class="badge ${klass}">${escapeHtml(value)}</span>`;
    }

    function tableJobs() {
      return jobs.filter(job => appliedGroups.has(job.statusGroup) && (activeStatus === "全部" || job.statusGroup === activeStatus));
    }

    function renderTabs() {
      document.getElementById("statusTabs").innerHTML = statusFilters.map(status =>
        `<button class="${status === activeStatus ? "active" : ""}" data-status="${status}">${status}</button>`
      ).join("");
      document.querySelectorAll("[data-status]").forEach(btn => btn.onclick = () => {
        activeStatus = btn.dataset.status;
        render();
      });
    }

    function renderMetrics() {
      const recommended = jobs.filter(j => j.recommended).length;
      const applied = jobs.filter(j => appliedGroups.has(j.statusGroup)).length;
      const followups = jobs.filter(j => ["沟通中", "面试中", "谈薪中", "Offer"].includes(j.statusGroup) || hasAction(j)).length;
      const offers = jobs.filter(j => j.statusGroup === "Offer").length;
      document.getElementById("recommendedJobs").textContent = recommended;
      document.getElementById("appliedJobs").textContent = applied;
      document.getElementById("followupJobs").textContent = followups;
      document.getElementById("offerJobs").textContent = offers;

      const funnelItems = [
        ["建议投递", recommended, "amber"],
        ["已投递", applied, "teal"],
        ["沟通中", jobs.filter(j => j.statusGroup === "沟通中").length, "blue"],
        ["面试中", jobs.filter(j => j.statusGroup === "面试中").length, "blue"],
        ["谈薪中", jobs.filter(j => j.statusGroup === "谈薪中").length, "green"],
        ["Offer", offers, "green"]
      ];
      const max = Math.max(...funnelItems.map(item => item[1]), 1);
      document.getElementById("funnel").innerHTML = funnelItems.map(([label, value, color]) => {
        const width = Math.max((value / max) * 100, value > 0 ? 8 : 0);
        return `<div class="funnel-row"><div>${label}</div><div class="bar-track"><div class="bar ${color}" style="width:${width}%"></div></div><strong>${value}</strong></div>`;
      }).join("");
    }

    function renderBanner() {
      const action = jobs.find(hasAction);
      const best = jobs.filter(j => j.recommended).sort((a, b) => b.score - a.score)[0];
      const next = action || best;
      document.getElementById("nextBanner").innerHTML = next
        ? `<div><strong>下一个优先处理：${escapeHtml(next.company)}</strong><span>${hasAction(next) ? "需要查看后续要求。" : `建议优先投递，当前评分 ${next.score}/10。`}</span></div><a class="action secondary" href="${escapeHtml(next.url)}" target="_blank">打开</a>`
        : `<div><strong>暂无待行动事项</strong><span>当前没有面试、笔试或必须回复的记录。</span></div>`;
    }

    function renderRecommendations() {
      const recs = jobs.filter(j => j.recommended).sort((a, b) => b.score - a.score);
      document.getElementById("recommendCards").innerHTML = recs.map(job => `
        <article class="job-card">
          <div class="badges">${platformBadge(job.source)}${badge(job.match)}${badge(job.status)}</div>
          <div class="score"><strong>${job.score.toFixed(1)}</strong><span>/ 10</span></div>
          <h3>${escapeHtml(job.company)} - ${escapeHtml(job.title)}</h3>
          <div class="job-meta">${escapeHtml(job.location)} · ${escapeHtml(job.direction)} · 发布 ${escapeHtml(job.postedDate || "待核实")}</div>
          <p>${escapeHtml(job.reason)}</p>
          <p class="muted">${escapeHtml(job.scoreReason)}</p>
          <p class="muted">${escapeHtml(job.risk)}</p>
          <div class="actions">
            <a class="action" href="${escapeHtml(job.url)}" target="_blank">去投递</a>
            <a class="action secondary" href="${escapeHtml(job.url)}" target="_blank">查看 JD</a>
          </div>
        </article>
      `).join("");
    }

    function renderTodos() {
      const actions = jobs.filter(hasAction);
      document.getElementById("todoList").innerHTML = actions.length
        ? actions.map(j => `<div class="todo"><strong>${escapeHtml(j.company)} - ${escapeHtml(j.status)}</strong><p>${escapeHtml(j.followup || j.risk)}</p></div>`).join("")
        : `<div class="todo"><strong>暂无面试/笔试待办</strong><p>目前 Gmail 和 Base 没有识别到需要立刻处理的后续。收到新邮件或你发 bot 后会更新这里。</p></div>`;
    }

    function renderTable() {
      const rows = tableJobs();
      document.getElementById("jobRows").innerHTML = rows.length
        ? rows.map(job => `
          <tr>
            <td><strong>${escapeHtml(job.title)}</strong><div class="muted">${escapeHtml(job.direction)}</div></td>
            <td>${escapeHtml(job.company)}<div class="muted">${escapeHtml(job.location)}</div></td>
            <td>${platformBadge(job.source)}</td>
            <td>${badge(job.statusGroup)}</td>
            <td>${badge(job.match)}</td>
            <td><div>投递 ${escapeHtml(job.appliedDate || "未填")}</div><div class="muted">发现 ${escapeHtml(job.foundDate || "未填")}</div></td>
            <td><div>${escapeHtml(job.followup)}</div><div class="muted">${escapeHtml(job.risk)}</div></td>
            <td><a class="action secondary" href="${escapeHtml(job.url)}" target="_blank">打开</a></td>
          </tr>
        `).join("")
        : `<tr><td colspan="8" class="muted">当前状态筛选下没有记录。</td></tr>`;
    }

    function render() {
      document.getElementById("updated").textContent = `最后更新：${generatedAt}；文件：${dashboardPath}`;
      renderTabs();
      renderMetrics();
      renderBanner();
      renderRecommendations();
      renderTodos();
      renderTable();
    }

    render();
  </script>
